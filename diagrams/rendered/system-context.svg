ones vs CDC / WHO | signals |</text><text x="581.5" y="651.76" fill="#000" font-size="14" textLength="124.455" font-family="Arial">history | reminders</text></g><!--entity WHO--><g class="entity" data-qualified-name="WHO" id="ent0006" data-source-line="36"><rect x="7" y="362.439" width="252.039" height="104.697" fill="#EEF6EE" style="stroke:#3F7F4F;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="92.711" y="386.002" fill="#000" font-size="14" textLength="80.616" font-style="italic" font-family="Arial">«reference»</text><text x="17" y="402.941" fill="#000" font-size="14" textLength="196.362" font-family="Arial">WHO Child Growth Standards</text><text x="17" y="419.881" fill="#000" font-size="14" textLength="228.389" font-family="Arial">(LMS tables 0-60 months from the</text><text x="17" y="436.82" fill="#000" font-size="14" textLength="232.039" font-family="Arial">WHO anthro package; windows for</text><text x="17" y="453.76" fill="#000" font-size="14" textLength="131.961" font-family="Arial">6 motor milestones)</text></g><!--entity CDC--><g class="entity" data-qualified-name="CDC" id="ent0007" data-source-line="37"><rect x="294" y="370.939" width="212.063" height="87.758" fill="#EEF6EE" style="stroke:#3F7F4F;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="359.723" y="394.502" fill="#000" font-size="14" textLength="80.616" font-style="italic" font-family="Arial">«reference»</text><text x="304" y="411.441" fill="#000" font-size="14" textLength="168.697" font-family="Arial">CDC milestone checklists</text><text x="304" y="428.381" fill="#000" font-size="14" textLength="192.063" font-family="Arial">(2022 revision, 12 checklists,</text><text x="304" y="445.32" fill="#000" font-size="14" textLength="136.609" font-family="Arial">2 months to 5 years)</text></g><!--entity KZ--><g class="entity" data-qualified-name="KZ" id="ent0008" data-source-line="38"><rect x="541.5" y="370.939" width="187.084" height="87.758" fill="#EEF6EE" style="stroke:#3F7F4F;stroke-width:0.5;" rx="2.5" ry="